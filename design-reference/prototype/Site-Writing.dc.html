<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Writing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
.status{position:relative;display:inline-block;height:20px;width:170px;vertical-align:middle}
.status .w{position:absolute;left:0;top:0;opacity:0;white-space:nowrap;animation:cycle 8s infinite}
.status .w1{animation-delay:0s}.status .w2{animation-delay:2s}.status .w3{animation-delay:4s}.status .w4{animation-delay:6s}
.status .w::after{content:attr(data-text);position:absolute;left:0;top:0;color:transparent;background:linear-gradient(90deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 65%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation:shimmer 1.8s linear infinite}
.star{display:inline-block;animation:spin 3s linear infinite}
@keyframes cycle{0%{opacity:0;transform:translateY(4px)}4%,21%{opacity:1;transform:none}25%,100%{opacity:0;transform:translateY(-4px)}}
@keyframes shimmer{from{background-position:150% 0}to{background-position:-100% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.status .w{animation:none}.status .w1{opacity:1}.status .w::after{animation:none;background:none}.star{animation:none}}
a{text-underline-offset:4px} a:hover{color:#FFFFFF !important}
body{margin:0;background:#282C34}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; box-sizing: border-box; background: #282C34; color: #D7DAE0; font-family: 'Geist', 'Helvetica Neue', sans-serif; padding: 56px 0 56px 260px;">
<div style="width: 820px; min-height: 100%; display: flex; flex-direction: column; gap: 64px;">
<header style="display: flex; justify-content: space-between; align-items: center; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px;"><nav aria-label="Main" style="display: flex; gap: 24px;"><a href="Site-Home.dc.html" style="text-decoration: none; color: #D7DAE0;">{{t.home}}</a><a href="Site-Projects.dc.html" style="text-decoration: none; color: #D7DAE0;">{{t.projects}}</a><a href="Site-Writing.dc.html" aria-current="page" style="text-decoration: none; color: #61AFEF;">{{t.writing}}</a><a href="Site-Videos.dc.html" style="text-decoration: none; color: #D7DAE0;">{{t.videos}}</a><a href="Site-About.dc.html" style="text-decoration: none; color: #D7DAE0;">{{t.about}}</a></nav><div style="display: flex; gap: 4px;"><button type="button" aria-pressed="{{isEn}}" onClick="{{setEn}}" style="min-height: 44px; min-width: 44px; padding: 0 12px; border: 1px solid #3A3F4B; border-radius: 6px; font: inherit; cursor: pointer; background: {{enBg}}; color: {{enFg}};">en</button><button type="button" aria-pressed="{{isEs}}" onClick="{{setEs}}" style="min-height: 44px; min-width: 44px; padding: 0 12px; border: 1px solid #3A3F4B; border-radius: 6px; font: inherit; cursor: pointer; background: {{esBg}}; color: {{esFg}};">es</button></div></header>
<section style="display: flex; flex-direction: column; gap: 14px;"><h1 style="margin: 0; font-size: 44px; font-weight: 600; letter-spacing: -0.02em;">{{t.writing}}</h1><p style="margin: 0; font-size: 19px; line-height: 1.6; color: #C0C5CE;">{{t.intro}}</p></section>
<div role="group" aria-label="{{t.filterLabel}}" style="display: flex; gap: 8px; flex-wrap: wrap;"><button type="button" aria-pressed="{{on_all}}" onClick="{{f_all}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3F4B; background: {{bg_all}}; color: {{fg_all}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; cursor: pointer;">{{t.c_all}}</button><button type="button" aria-pressed="{{on_eng}}" onClick="{{f_eng}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3F4B; background: {{bg_eng}}; color: {{fg_eng}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; cursor: pointer;">{{t.c_eng}}</button><button type="button" aria-pressed="{{on_learn}}" onClick="{{f_learn}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3F4B; background: {{bg_learn}}; color: {{fg_learn}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; cursor: pointer;">{{t.c_learn}}</button><button type="button" aria-pressed="{{on_notes}}" onClick="{{f_notes}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #3A3F4B; background: {{bg_notes}}; color: {{fg_notes}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; cursor: pointer;">{{t.c_notes}}</button></div>
<section style="display: flex; flex-direction: column;">
<sc-if value="{{showPost}}" hint-placeholder-val="{{ true }}"><a href="Site-Post.dc.html" style="text-decoration: none; color: #D7DAE0; display: flex; justify-content: space-between; align-items: baseline; gap: 24px; padding: 18px 0; border-top: 1px solid #3A3F4B;"><span style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 19px; font-weight: 500;">{{t.postTitle}}</span><span style="font-size: 16px; color: #949AA6; line-height: 1.55;">{{t.postDesc}}</span></span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #949AA6; white-space: nowrap;">[date] · {{t.tagEng}}</span></a><sc-if value="{{isEs}}" hint-placeholder-val="{{ false }}"><p style="margin: 8px 0 0; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #949AA6;">// {{t.enOnly}}</p></sc-if></sc-if>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 18px 0; border-top: 1px solid #3A3F4B; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px; color: #949AA6;">// {{t.none}}</p></sc-if>
</section>
<div style="margin-top: auto;"><footer style="display: flex; justify-content: space-between; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; color: #949AA6; border-top: 1px solid #3A3F4B; padding-top: 20px;"><span>© daniel guzman — {{t.made}}</span><span style="display: flex; gap: 20px;"><a href="#" style="color: #D7DAE0;">github</a><a href="#" style="color: #D7DAE0;">linkedin</a><a href="#" style="color: #D7DAE0;">youtube</a></span></footer></div>
</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: 'en', filter: 'all' }; }
  renderVals() {
    const T = {"en": {"home": "home", "projects": "projects", "writing": "writing", "videos": "videos", "about": "about", "made": "made in lima", "progress": "In progress", "w0": "building…", "w1": "thinking…", "w2": "testing…", "w3": "pivoting…", "postTitle": "Shipping with AI agents without losing control of the “how”", "postDesc": "What building CoCapital taught me about letting agents make architecture decisions, and what I changed.", "enOnly": "", "tagEng": "engineering", "tagLearn": "learning", "tagNotes": "notes", "videoTitle": "Building Admitidos, part 1", "videoNote": "in spanish", "mkTitle": "From workshop to self-paced manual", "mkDesc": "Not everyone learned at the same pace, so I turned an AI workshop into a self-paced manual, answered questions along the way, and built a tool to produce those manuals.", "adNow": "For students in Peru getting into university. Right now: an admissions results portal.", "coDesc": "A shared-capital tracker for partners. It started with two friends and S/ 1,000.", "trDesc": "An electronic invoicing API for Peruvian developers, built on SUNAT’s rules.", "live": "live", "wip": "in progress", "back": "← back", "intro": "Notes on building with AI, learning, and the tech industry. One post a month, more or less.", "filterLabel": "Filter by tag", "c_all": "all", "c_eng": "engineering", "c_learn": "learning", "c_notes": "notes", "none": "nothing here yet."}, "es": {"home": "inicio", "projects": "proyectos", "writing": "escritos", "videos": "videos", "about": "sobre mí", "made": "hecho en lima", "progress": "En progreso", "w0": "construyendo…", "w1": "pensando…", "w2": "probando…", "w3": "pivoteando…", "postTitle": "Shipping with AI agents without losing control of the “how”", "postDesc": "Lo que aprendí construyendo CoCapital sobre dejar que los agentes decidan la arquitectura, y qué cambié.", "enOnly": "artículo en inglés", "tagEng": "ingeniería", "tagLearn": "aprendizaje", "tagNotes": "notas", "videoTitle": "Construyendo Admitidos, parte 1", "videoNote": "en español", "mkTitle": "Del taller al manual autoguiado", "mkDesc": "No todos aprendían al mismo ritmo, así que convertí un taller de IA en un manual autoguiado, resolví dudas en el camino y construí una herramienta para producir esos manuales.", "adNow": "Para estudiantes que postulan a la universidad en Perú. Ahora mismo: un portal de resultados de admisión.", "coDesc": "App de capital compartido para socios. Empezó con dos amigos y S/ 1,000.", "trDesc": "Una API de facturación electrónica para desarrolladores peruanos, basada en las reglas de SUNAT.", "live": "en vivo", "wip": "en progreso", "back": "← volver", "intro": "Notas sobre construir con IA, aprender y la industria tech. Más o menos un post al mes.", "filterLabel": "Filtrar por etiqueta", "c_all": "todo", "c_eng": "ingeniería", "c_learn": "aprendizaje", "c_notes": "notas", "none": "todavía no hay nada aquí."}};

    const f = this.state.filter; const K = ['all', 'eng', 'learn', 'notes']; const ex = {};
    K.forEach(k => { const on = f === k; ex['on_' + k] = on; ex['bg_' + k] = on ? '#3E4451' : 'transparent'; ex['fg_' + k] = on ? '#D7DAE0' : '#949AA6'; ex['f_' + k] = () => this.setState({ filter: k }); });
    const showPost = f === 'all' || f === 'eng';
    return {

      enBg: es ? 'transparent' : '#3E4451', enFg: es ? '#949AA6' : '#D7DAE0',
      esBg: es ? '#3E4451' : 'transparent', esFg: es ? '#D7DAE0' : '#949AA6',
      setEn: () => this.setState({ lang: 'en' }), setEs: () => this.setState({ lang: 'es' }), ...ex, showPost, empty: !showPost
    };
  }
}
</script>
</body>
</html>
